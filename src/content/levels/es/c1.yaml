code: c1
name: C1 Maila (EGA)
description: 'Nivel de dominio operativo eficaz. Equivale al histórico EGA (PL3 / HABE 3. maila). Hoy se acredita con el examen HABE C1; en Navarra sigue convocándose el EGA (tres pruebas eliminatorias).'
order: 5
status: active
beta: true
curriculum:
