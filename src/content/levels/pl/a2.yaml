- id: a2-doctor-visit
  title: 'W gabinecie lekarskim (mediku-kontsultan: zer duzu?, mina daukat, hartu pilula bat)'
- id: a2-healthy-habits
  title: Zdrowe nawyki (kirola egin, ondo lo egin, fruta jan, erre, alkohola)
- id: a2-environment
  title: Środowisko (ingurumena, kutsadura, birziklatu, energia, klima-aldaketa)
- id: a2-civic-life
  title: Życie społeczne i obywatelskie (auzoa, herria, partehartzea, boluntariotza, jaiak)
- id: a2-agintera-intro
  title: 'Tryb rozkazujący (agintera): podstawowe formy twierdzące (zatoz, hartu, joan zaitez)'
- id: a2-agintera-uses
  title: 'Użycie trybu rozkazującego: instrukcje, rady, prośby (mesedez, hartu eseri)'
- id: a2-agintera-negation
  title: Tryb rozkazujący przeczący (ez egin, ez joan, ez ezazu hartu)
- id: a2-past-nor
  title: 'Czas przeszły izan/egon — NOR: nintzen, zinen, zen, ginen, zineten, ziren / nengoen, zegoen'
- id: a2-past-nor-nork
  title: 'Czas przeszły ukan — NOR-NORK: nuen, zenuen, zuen, genuen, zenuten, zuten / nituen, zituen'
- id: a2-past-trinkoak
  title: 'Czas przeszły czasowników syntetycznych (joan/etorri/ibili/eduki/jakin: nindoan, nentorren, nenbilen, neukan, nekien)'
- id: a2-past-time-markers
  title: Określenia czasu przeszłego dokonanego (atzo, joan den astean, duela X urte, orduan, gero)
- id: a2-past-narrative
  title: 'Opowiadanie o doświadczeniu: łączenie czynności w czasie przeszłym (lehenengo... gero... azkenean)'
- id: a2-past-imperfect
  title: 'Czas przeszły niedokonany: aditza-tzen + nintzen/zen (lan egiten nuen, joaten nintzen)'
