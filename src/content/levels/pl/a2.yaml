code: a2
name: A2 Maila
description: Poziom podstawowy. Samodzielne rozumienie i tworzenie wypowiedzi w typowych sytuacjach życia codziennego, z narracją w czasie przeszłym, planami na przyszłość i prostymi opiniami.
order: 2
status: active
beta: false
curriculum:
- id: a2-health-vocab
