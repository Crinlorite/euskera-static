<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Placa blanca: el lauburu fino anterior era #1A1A1A sobre transparente y
       desaparecía en pestañas/fondos oscuros. Placa + pétalos = el icono de la app. -->
  <rect width="200" height="200" rx="42" fill="#FFFFFF"/>
  <defs>
    <ellipse id="petalo" cx="58" cy="0" rx="40" ry="26"/>
  </defs>
  <g transform="translate(100 100)">
    <use href="#petalo" transform="rotate(-135)" fill="#00964B"/>
    <use href="#petalo" transform="rotate(-45)"  fill="#D52B1E"/>
    <use href="#petalo" transform="rotate(45)"   fill="#00964B"/>
    <use href="#petalo" transform="rotate(135)"  fill="#D52B1E"/>
  </g>
</svg>
